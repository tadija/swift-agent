name: Swift
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
            container: swift:6.4
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Complete test suite
        run: SWIFT_AGENT_INTEGRATION_TESTS=1 swift test --parallel --num-workers 4
      - run: sh Tests/Integration/build-tool-smoke.sh
      - run: sh Tests/Integration/package-consumer-smoke.sh
      - run: sh Tests/Integration/source-update-smoke.sh
      - name: Declare artifact build identity
        run: |
          swift -e '
          import Foundation
          let input = URL(fileURLWithPath: "Sources/swift-agent/agent.json")
          var product = try JSONSerialization.jsonObject(with: Data(contentsOf: input)) as! [String: Any]
          let revision = ProcessInfo.processInfo.environment["GITHUB_SHA"]!
          product["build"] = String(revision.prefix(7))
          var data = try JSONSerialization.data(withJSONObject: product, options: [.prettyPrinted, .sortedKeys])
          data.append(0x0A)
          try data.write(to: input, options: .atomic)
          '
      - run: ./Scripts/install.sh /tmp/swift-agent-bin
      - run: sh Tests/Integration/generic-cli-smoke.sh /tmp/swift-agent-bin/swift-agent
      - run: sh Tests/Integration/cli-commands-smoke.sh /tmp/swift-agent-bin/swift-agent
      - name: Package tested CLI
        run: |
          mkdir -p dist/swift-agent
          cp /tmp/swift-agent-bin/swift-agent README.md LICENSE dist/swift-agent/
          tar -czf "dist/swift-agent-$(uname -s)-$(uname -m).tar.gz" -C dist swift-agent
      - uses: actions/upload-artifact@v4
        with:
          name: swift-agent-${{ matrix.os }}
          path: dist/*.tar.gz
